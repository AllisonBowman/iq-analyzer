name: IQCoach
options:
  bundleIdPrefix: com.allisonbowman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  IQCoach:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allisonbowman.iqcoach
        PRODUCT_NAME: IQCoach
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IQ Coach
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT licence"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "IQ Coach copies your newest camera photos into its own folder so the analyzer can measure them. Your library is only read, never changed."
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
  IQCoachTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IQCoachTests
    dependencies:
      - target: IQCoach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.allisonbowman.iqcoach.tests
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IQCoach.app/Contents/MacOS/IQCoach"
schemes:
  IQCoach:
    build:
      targets:
        IQCoach: all
        IQCoachTests: [test]
    test:
      targets:
        - IQCoachTests
