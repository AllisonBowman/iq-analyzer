[project]
name = "iqa"
version = "0.1.0"
description = "Image-quality analysis of real photographs: ISO 12233 slanted-edge MTF, noise/SNR, dynamic range, clipping and colour statistics."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9", "Pillow>=10.0",
  "pillow-heif>=0.16", "rawpy>=0.19", "exifread>=3.0", "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
iqa = "iqa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
